# Configuración de Trivy (la usan GitHub Actions y tu PC):
#   trivy fs --config trivy.yaml .
# Falla con CRITICAL/HIGH en dependencias, cualquier secreto o mala configuración.
scan:
  scanners:
    - vuln
    - secret
    - misconfig
  skip-dirs:
    - target
    - .idea
    - .mvn
severity:
  - CRITICAL
  - HIGH
vulnerability:
  ignore-unfixed: true
ignorefile: .trivyignore
