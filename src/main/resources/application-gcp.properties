# ---------------------------------------------------------------------
# Perfil "gcp": Cloud Run privado detrás del API Gateway (ADR-0017) y del WAF (ADR-0018), con Cloud SQL.
# Este archivo NO lleva secretos ni URLs reales: salen de variables de entorno de Cloud Run.
# Despliegue paso a paso: docs/despliegue/gcp.md
# ---------------------------------------------------------------------

# Cloud Run indica el puerto en PORT (8080 por defecto)
server.port=${PORT:8080}

# El gateway reenvía la ruta completa (path_translation: APPEND_PATH_TO_ADDRESS), así que el backend
# atiende bajo /api. En local sigue sin prefijo.
server.servlet.context-path=/api

# Cloud SQL (ADR-0012): spring.datasource.* de application.properties, con estas variables de Cloud Run:
#   JJSKAFFEE_DB_URL     jdbc:postgresql:///<base>?cloudSqlInstance=<proyecto>:<region>:<instancia>&socketFactory=com.google.cloud.sql.postgres.SocketFactory
#                        Sin host: el conector postgres-socket-factory abre la conexión cifrada a la instancia
#                        con la cuenta de servicio de Cloud Run (roles/cloudsql.client), sin IP autorizada.
#   JJSKAFFEE_DB_USUARIO app_jjskaffee (nunca postgres)
#   JJSKAFFEE_DB_CLAVE   desde Secret Manager (ADR-0014), secreto jjskaffee-db-clave, con --set-secrets
# Firebase usa las credenciales de la cuenta de servicio de Cloud Run: JJSKAFFEE_FIREBASE_CREDENCIALES va vacía.

# Origen(es) del frontend, separados por coma. El preflight de CORS pasa por el gateway sin token y
# lo responde el backend. Sin la variable, la aplicación no arranca.
jjskaffee.cors.origenes=${JJSKAFFEE_CORS_ORIGENES}

# Secreto del encabezado X-JJSKaffee-Origen que pone el balanceador con Cloud Armor (ADR-0018). En Cloud Run
# se monta desde el secreto jjskaffee-waf-secreto de Secret Manager. Sin la variable, la aplicación no arranca;
# vacía, no se exige (solo antes de montar el WAF o si se quitó).
jjskaffee.waf.secreto=${JJSKAFFEE_WAF_SECRETO}
