# ---------------------------------------------------------------------
# Perfil "gcp": Cloud Run privado detrás del API Gateway (ADR-0017).
# Este archivo NO lleva secretos ni URLs reales: salen de variables de entorno de Cloud Run.
# Pendiente (ADR-0014): conexión a Cloud SQL y secretos desde Secret Manager.
# ---------------------------------------------------------------------

# El gateway reenvía la ruta completa (path_translation: APPEND_PATH_TO_ADDRESS), así que el backend
# atiende bajo /api. En local sigue sin prefijo.
server.servlet.context-path=/api

# Origen(es) del frontend, separados por coma. El preflight de CORS pasa por el gateway sin token y
# lo responde el backend. Sin la variable, la aplicación no arranca.
jjskaffee.cors.origenes=${JJSKAFFEE_CORS_ORIGENES}

# Secreto del encabezado X-JJSKaffee-Origen que pone el balanceador con Cloud Armor (ADR-0018). En Cloud Run
# se monta desde el secreto jjskaffee-waf-secreto de Secret Manager. Sin la variable, la aplicación no arranca;
# vacía, no se exige (solo si se quitó el WAF).
jjskaffee.waf.secreto=${JJSKAFFEE_WAF_SECRETO}
