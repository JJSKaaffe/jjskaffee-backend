# =====================================================================
# Perfil "https": SOLO para tu PC, con un certificado autofirmado.
# Actívalo junto con local  ->  Active profiles: local,https
#
# El navegador va a avisar que el certificado no es de confianza: es normal,
# lo firmaste tú mismo. Se acepta la advertencia una vez y sigue.
#
# En Cloud Run NO se usa este perfil: allá el certificado lo pone Google y la
# aplicación recibe HTTP plano. Activar SSL allá rompería el despliegue.
# =====================================================================
server:
  port: ${JJSKAFFEE_PUERTO_HTTPS:8443}
  ssl:
    enabled: true
    # Ruta relativa a la raíz del proyecto (donde está el pom.xml)
    key-store: ${JJSKAFFEE_CERTIFICADO:file:./certificado-local.p12}
    key-store-type: PKCS12
    key-store-password: ${JJSKAFFEE_CERTIFICADO_CLAVE:cambiar_en_desarrollo}
    key-alias: jjskaffee-local
