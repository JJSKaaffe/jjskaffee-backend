# =====================================================================
# JJSKaffee · backend modular · configuración común
# Sin contraseñas aquí (ADR-0014): llegan por variables de entorno, o por un
# archivo .env en tu PC (perfil local), o por Secret Manager en la nube.
# =====================================================================
spring:
  application:
    name: jjskaffee-backend-modular

  datasource:
    # Misma base que el backend hexagonal: esquema "jjskaffee", usuario limitado app_jjskaffee (SPIKE-03)
    url: ${JJSKAFFEE_DB_URL:jdbc:postgresql://localhost:5432/jjskaffee?currentSchema=jjskaffee}
    username: ${JJSKAFFEE_DB_USUARIO:app_jjskaffee}
    password: ${JJSKAFFEE_DB_CONTRASENA}
    hikari:
      maximum-pool-size: 10
      # Fechas de la sesión en UTC-0 (el rol app_jjskaffee también lo tiene configurado)
      connection-init-sql: SET TIME ZONE 'UTC'

  # Todos los textos para el usuario (errores, validaciones) salen de aquí
  messages:
    basename: i18n/mensajes
    encoding: UTF-8
    fallback-to-system-locale: false

  web:
    locale: es
    locale-resolver: fixed

server:
  shutdown: graceful
  # El proveedor (Cloud Run, Railway, Render...) asigna el puerto por la variable PORT
  port: ${PORT:8080}
  # El TLS lo termina el proxy del proveedor, no la aplicacion: aqui solo hay que creerle
  # a X-Forwarded-Proto para que las URLs que arme Spring (Location, instance del error)
  # salgan con https y el navegador no las bloquee por contenido mixto.
  forward-headers-strategy: framework

# Salud para el despliegue (Cloud Run) y trazas OpenTelemetry
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

# Cada línea de log lleva traceId/spanId (OpenTelemetry) y la cafetería/usuario (MDC del FiltroAutenticacion)
logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] [caf=%X{idCafeteria:-} usr=%X{idUsuario:-} rol=%X{rol:-}] "

jjskaffee:
  seguridad:
    modo: firebase
    proyecto-firebase: ${JJSKAFFEE_FIREBASE_PROYECTO:}
    claim-cafeteria: id_cafeteria
  cors:
    origenes: ${JJSKAFFEE_CORS_ORIGENES:http://localhost:5173}
