spring.application.name=JJSkafee-Joel-UCO

# ---------------------------------------------------------------------
# Configuración común a todos los perfiles.
# Los valores sensibles salen de variables de entorno (ADR-0014): nunca escribirlos aquí.
# Perfiles: "local" (tu PC, lee .env) y "gcp" (Cloud Run detrás del API Gateway, con el prefijo /api).
# A "gcp" todavía le falta la URL de Cloud SQL y leer los secretos de Secret Manager (ADR-0014).
# ---------------------------------------------------------------------

# PostgreSQL: siempre con el usuario limitado app_jjskaffee, nunca con postgres (SPIKE-03)
spring.datasource.url=${JJSKAFFEE_DB_URL}
spring.datasource.username=${JJSKAFFEE_DB_USUARIO}
spring.datasource.password=${JJSKAFFEE_DB_CLAVE}
spring.datasource.hikari.maximum-pool-size=${JJSKAFFEE_DB_POOL:10}
# Falla rápido si la BD no responde (meta: registrar en <= 3 s)
spring.datasource.hikari.connection-timeout=3000

# Firebase Authentication (ADR-0001)
jjskaffee.firebase.project-id=${JJSKAFFEE_FIREBASE_PROJECT_ID:}
jjskaffee.firebase.credenciales=${JJSKAFFEE_FIREBASE_CREDENCIALES:}

# Las fechas de los filtros (desde/hasta) se interpretan en la hora de Colombia
jjskaffee.zona-horaria=America/Bogota

# Orígenes del frontend con CORS (vacío = ninguno). Cada perfil pone los suyos
jjskaffee.cors.origenes=

# Las cantidades son enteras: "cantidad": 1.5 responde 400 en vez de truncarse a 1 sin avisar
spring.jackson.deserialization.accept-float-as-int=false

# Errores en formato ProblemDetail (RFC 9457), sin trazas al cliente
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never
