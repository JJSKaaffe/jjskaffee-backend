# =====================================================================
# Despliegue a Google Cloud Run (HTTPS con certificado administrado por Google).
#
# Antes de que esto funcione hay que crear, una sola vez, los secretos del
# repositorio en GitHub (Settings > Secrets and variables > Actions):
#
#   GCP_PROYECTO id del proyecto de Google Cloud (ej. jjskaffee-prod)
#   GCP_CUENTA_SERVICIO JSON completo de la cuenta de servicio con permisos de
#                         Cloud Run Admin, Artifact Registry Writer y Service Account User
#
# Y en Google Cloud, una sola vez:
#   - habilitar las APIs: run, artifactregistry, secretmanager, sqladmin
#   - crear el repositorio de Artifact Registry llamado "jjskaffee"
#   - guardar la contraseña de la base en Secret Manager como "jjskaffee-db-contrasena"
#
# Cloud Run entrega el servicio en https://<nombre>-<hash>.run.app sin que haya
# que comprar ni renovar certificado.
# =====================================================================
name: Despliegue a Cloud Run

# Solo manual: desde GitHub > Actions > "Despliegue a Cloud Run" > Run workflow.
# Mientras no existan los secretos de Google Cloud, un despliegue automático en
# cada push solo ensucia el historial con fallos.
on:
  workflow_dispatch:

env:
  REGION: us-central1
  SERVICIO: jjskaffee-backend-modular
  REPOSITORIO: jjskaffee

permissions:
  contents: read

jobs:
  desplegar:
    name: Construir imagen y desplegar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Autenticarse en Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CUENTA_SERVICIO }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Preparar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Construir y subir la imagen
        run: |
          IMAGEN="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROYECTO }}/${{ env.REPOSITORIO }}/${{ env.SERVICIO }}:${{ github.sha }}"
          docker build -t "$IMAGEN" .
          docker push "$IMAGEN"
          echo "IMAGEN=$IMAGEN" >> "$GITHUB_ENV"

      - name: Revisar la imagen con Trivy antes de desplegar
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ${{ env.IMAGEN }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Desplegar en Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICIO }}" \
            --image "${{ env.IMAGEN }}" \
            --project "${{ secrets.GCP_PROYECTO }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 --memory 512Mi \
            --min-instances 0 --max-instances 3 \
            --set-env-vars "SPRING_PROFILES_ACTIVE=nube" \
            --set-env-vars "JJSKAFFEE_DB_URL=${{ vars.JJSKAFFEE_DB_URL }}" \
            --set-env-vars "JJSKAFFEE_DB_USUARIO=app_jjskaffee" \
            --set-env-vars "JJSKAFFEE_MODO_SEGURIDAD=firebase" \
            --set-env-vars "JJSKAFFEE_FIREBASE_PROYECTO=${{ vars.JJSKAFFEE_FIREBASE_PROYECTO }}" \
            --set-env-vars "JJSKAFFEE_CORS_ORIGENES=${{ vars.JJSKAFFEE_CORS_ORIGENES }}" \
            --set-secrets "JJSKAFFEE_DB_CONTRASENA=jjskaffee-db-contrasena:latest"

      - name: Mostrar la URL del servicio
        run: |
          gcloud run services describe "${{ env.SERVICIO }}" \
            --project "${{ secrets.GCP_PROYECTO }}" \
            --region "${{ env.REGION }}" \
            --format 'value(status.url)'