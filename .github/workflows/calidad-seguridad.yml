# Escaneo de código y validaciones del backend modular de JJSKaffee
# - Pruebas unitarias + ArchUnit (reglas del monolito modular) + MensajesTest (no hay textos quemados)
# - Pruebas de integración contra PostgreSQL 17 con el mismo esquema y RLS (db/jjskaffee_completo.sql)
# - Trivy: vulnerabilidades en dependencias, secretos y malas configuraciones (misma versión que en local)
# - CodeQL: análisis estático de seguridad y calidad del código Java
name: Calidad y seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 11 * * 1'   # lunes 6:00 a. m. hora Colombia (detecta CVEs nuevos aunque no haya commits)
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas + ArchUnit + PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jjskaffee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      # Credenciales SOLO de la base temporal del workflow (la del script de desarrollo)
      JJSKAFFEE_PRUEBAS_DB_URL: jdbc:postgresql://localhost:5432/jjskaffee?currentSchema=jjskaffee
      JJSKAFFEE_PRUEBAS_DB_USUARIO: app_jjskaffee
      JJSKAFFEE_PRUEBAS_DB_CONTRASENA: cambiar_en_desarrollo
    steps:
      - uses: actions/checkout@v5

      - name: Cargar el esquema, el RLS y los datos de prueba
        run: |
          psql -h localhost -U postgres -d jjskaffee -v ON_ERROR_STOP=1 -q -f db/jjskaffee_completo.sql
          # Las pruebas de la base del equipo (OK 1 ... OK 9) también deben pasar
          psql -h localhost -U postgres -d jjskaffee -v ON_ERROR_STOP=1 -f db/verificar_jjskaffee.sql
          # verificar_jjskaffee.sql deja datos (no hay DELETE); se recarga limpio para las pruebas Java
          psql -h localhost -U postgres -d jjskaffee -v ON_ERROR_STOP=1 -q -f db/jjskaffee_completo.sql

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Compilar y correr pruebas (ArquitecturaTest, MensajesTest, integración)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  trivy:
    name: Trivy (dependencias, secretos, configuración)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # para publicar resultados en la pestaña Security
    steps:
      - uses: actions/checkout@v5

      - name: Escanear repositorio y generar reporte SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0          # misma versión de Trivy que en local
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          skip-dirs: target
          trivyignores: .trivyignore
          format: sarif
          output: trivy.sarif
          exit-code: '0'

      - name: Publicar resultados en Security > Code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true    # en repos privados sin code scanning este paso no está disponible
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Fallar el build si hay vulnerabilidades críticas/altas o secretos
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          # Mismos criterios que trivy.yaml (el que usas en local)
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: target
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

  codeql:
    name: CodeQL (análisis del código Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none            # analiza el código fuente sin compilar (CodeQL aún no lista Java 27)
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-java
