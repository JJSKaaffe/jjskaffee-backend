name: Seguridad y Arquitectura

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  arquitectura:
    name: Tests y ArchUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B test

  trivy:
    name: Escaneo Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
